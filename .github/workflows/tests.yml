name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check Python syntax
        run: python -m py_compile sub2api_tg_bot.py docker-healthcheck.py
      - name: Run unit tests
        run: python -m unittest discover -v
        env:
          RUN_NETWORK_TESTS: "1"
      - name: Check installer syntax
        run: bash -n install.sh

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare example runtime files
        run: |
          cp .env.docker.example .env
          cp config.example.json config.json
          mkdir secrets
          touch secrets/telegram_bot_token secrets/webhook_secret secrets/postgres_password
      - name: Validate Compose configuration
        run: docker compose --file compose.example.yaml config --quiet
      - name: Build container image
        run: docker build --tag sub2api-usage-tg-bot:test .
      - name: Verify container user
        run: test "$(docker image inspect --format '{{.Config.User}}' sub2api-usage-tg-bot:test)" = "10001:10001"
